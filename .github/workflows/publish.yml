# PyPI 发布工作流：GitHub Release 发布时自动同步上传到 PyPI。
#
# 采用 PyPI Trusted Publishing（OIDC 短期凭证），仓库中不需要存放任何
# PYPI_API_TOKEN。一次性前置配置（仓库管理员在 PyPI 侧完成）：
#   https://pypi.org/manage/account/publishing/ → Pending Publisher
#     PyPI Project Name : MaxTiC-Next（PyPI 规范化为 maxtic-next）
#     Owner             : ZengZichao
#     Repository        : MaxTiC-Next
#     Workflow filename : publish.yml
#     Environment name  : pypi
# 待发布的项目名通过该 Pending Publisher 同时被预注册占用。
#
# 已有 Release（如 v0.1.1）补发：在 Actions 页手动运行本工作流（workflow_dispatch）。

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing 要求 workflow 持有 OIDC id-token 权限。
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
